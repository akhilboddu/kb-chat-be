services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - chatwise_net

  chatwise-api:
    build: .
    container_name: chatwise-api
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/db
      - chromadb_data:/app/chromadb_data
      - huggingface_cache:/app/.cache
    environment:
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - chatwise_net

volumes:
  db_data:
  chromadb_data:
  huggingface_cache:

networks:
  chatwise_net:
    driver: bridge
