services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - chatwise_net

  chatwise-api:
    build: .
    container_name: chatwise-api
    ports:
      - "8000:8000"
    volumes:
      # - ./db:/app/db  # [REMOVED: SQLite volume - now using Supabase]
      - huggingface_cache:/app/.cache

    environment:
      REDIS_URL: redis://redis:6379/0

    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy

    networks:
      - chatwise_net

  celery-worker-scrape:
    build: .
    image: chatwise-api
    command: celery -A app.worker.celery_app worker -Q scrape -c 4 --loglevel=info
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks: 
      - chatwise_net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  celery-worker-upload:
    build: .
    image: chatwise-api
    command: celery -A app.worker.celery_app worker -Q upload -c 4 --loglevel=info
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks: 
      - chatwise_net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Optional: Flower for monitoring
  flower:
    build: .
    image: chatwise-api
    command: celery -A app.worker.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    env_file:
      - .env
    depends_on:
      - redis
    networks: 
      - chatwise_net

volumes:
  huggingface_cache:
    name: huggingface_cache

networks:
  chatwise_net:
    driver: bridge
